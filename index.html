<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OrelhaAudio - Audio Visualizer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --orelha-size: 80px;
    --spin-speed: 3s;
  }

  body {
    background: #0a0014;
    overflow-x: hidden;
    min-height: 100vh;
    font-family: 'Press Start 2P', monospace;
    color: #ff6ec7;
    cursor: url('orelha_nobg.png') 40 40, auto;
  }

  /* ========== ORELLHA BACKGROUND TILE ========== */
  .orelha-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-image: url('orelha.png');
    background-size: 120px 120px;
    background-repeat: repeat;
    opacity: 0.06;
    z-index: -10;
    animation: bgPulse 2s ease-in-out infinite alternate;
  }
  @keyframes bgPulse {
    0% { opacity: 0.04; }
    100% { opacity: 0.1; }
  }

  /* ========== ORELLHA BORDER TOP ========== */
  .orelha-border-top, .orelha-border-bottom, .orelha-border-left, .orelha-border-right {
    position: fixed; z-index: 100; display: flex;
  }
  .orelha-border-top {
    top: 0; left: 0; width: 100%; flex-wrap: nowrap;
    overflow: hidden; height: 50px; background: rgba(10,0,20,0.8);
  }
  .orelha-border-bottom {
    bottom: 0; left: 0; width: 100%; flex-wrap: nowrap;
    overflow: hidden; height: 50px; background: rgba(10,0,20,0.8);
  }
  .orelha-border-left {
    top: 0; left: 0; height: 100%; flex-direction: column;
    overflow: hidden; width: 50px; background: rgba(10,0,20,0.8);
  }
  .orelha-border-right {
    top: 0; right: 0; height: 100%; flex-direction: column;
    overflow: hidden; width: 50px; background: rgba(10,0,20,0.8);
  }
  .orelha-border-top img, .orelha-border-bottom img {
    width: 50px; height: 50px; flex-shrink: 0;
    animation: borderBounce 1s ease-in-out infinite alternate;
  }
  .orelha-border-left img, .orelha-border-right img {
    width: 50px; height: 50px; flex-shrink: 0;
    animation: borderBounce 1s ease-in-out infinite alternate;
  }
  @keyframes borderBounce {
    0% { transform: scale(0.8) rotate(0deg); }
    50% { transform: scale(1.1) rotate(15deg); }
    100% { transform: scale(0.8) rotate(-15deg); }
  }

  /* ========== CORNER ORELLHAS ========== */
  .corner-orelha {
    position: fixed; z-index: 200; width: 100px; height: 100px;
    animation: cornerSpin 4s linear infinite;
    filter: drop-shadow(0 0 15px #ff6ec7) drop-shadow(0 0 30px #ff00ff);
  }
  .corner-orelha.tl { top: 55px; left: 55px; }
  .corner-orelha.tr { top: 55px; right: 55px; animation-direction: reverse; }
  .corner-orelha.bl { bottom: 55px; left: 55px; animation-direction: reverse; }
  .corner-orelha.br { bottom: 55px; right: 55px; }
  @keyframes cornerSpin {
    from { transform: rotate(0deg) scale(1); }
    25% { transform: rotate(90deg) scale(1.3); }
    50% { transform: rotate(180deg) scale(1); }
    75% { transform: rotate(270deg) scale(1.3); }
    to { transform: rotate(360deg) scale(1); }
  }

  /* ========== FLOATING ORELLHAS ========== */
  .floating-orelha {
    position: fixed; z-index: 50; pointer-events: none;
    animation: floatAround 8s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(255,110,199,0.5));
  }
  @keyframes floatAround {
    0%   { transform: translate(0,0) rotate(0deg) scale(1); }
    25%  { transform: translate(30px,-40px) rotate(90deg) scale(1.2); }
    50%  { transform: translate(-20px,30px) rotate(180deg) scale(0.8); }
    75%  { transform: translate(40px,20px) rotate(270deg) scale(1.1); }
    100% { transform: translate(0,0) rotate(360deg) scale(1); }
  }

  /* ========== TITLE ========== */
  .title-container {
    margin-top: 80px;
    text-align: center;
    position: relative;
    z-index: 10;
  }
  .title-container h1 {
    font-family: 'Bungee Shade', cursive;
    font-size: 3rem;
    color: #ff6ec7;
    text-shadow:
      0 0 10px #ff6ec7,
      0 0 20px #ff00ff,
      0 0 40px #ff00ff,
      0 0 80px #ff00ff,
      3px 3px 0 #00ffff,
      -3px -3px 0 #ffff00;
    animation: titleGlitch 0.5s infinite;
    position: relative;
  }
  .title-orelha-left, .title-orelha-right {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 80px; height: 80px;
    animation: titleEarDance 1s ease-in-out infinite alternate;
  }
  .title-orelha-left { left: -90px; }
  .title-orelha-right { right: -90px; transform: translateY(-50%) scaleX(-1); }
  @keyframes titleEarDance {
    0% { transform: translateY(-50%) rotate(-20deg) scale(1); }
    100% { transform: translateY(-50%) rotate(20deg) scale(1.2); }
  }
  @keyframes titleGlitch {
    0% { text-shadow: 0 0 10px #ff6ec7, 0 0 20px #ff00ff, 3px 3px 0 #00ffff; }
    25% { text-shadow: -3px 2px 0 #ff0000, 3px -2px 0 #00ffff; }
    50% { text-shadow: 3px 0 10px #ff6ec7, -3px 0 20px #00ffff, 0 0 40px #ff00ff; }
    75% { text-shadow: -2px -3px 0 #ffff00, 2px 3px 0 #ff00ff; }
    100% { text-shadow: 0 0 10px #ff6ec7, 0 0 20px #ff00ff, 3px 3px 0 #00ffff; }
  }
  .subtitle {
    font-size: 0.7rem; margin-top: 10px; color: #00ffff;
    text-shadow: 0 0 5px #00ffff;
    animation: subtitleBlink 1.5s step-start infinite;
  }
  @keyframes subtitleBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ========== MAIN VISUALIZER ========== */
  .visualizer-section {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    margin: 40px auto;
    position: relative; z-index: 10;
    padding: 30px;
  }

  .canvas-wrapper {
    position: relative;
    border: 4px solid #ff6ec7;
    border-radius: 20px;
    overflow: visible;
    box-shadow:
      0 0 20px #ff6ec7,
      0 0 40px #ff00ff,
      0 0 80px #ff00ff,
      inset 0 0 20px rgba(255,110,199,0.1);
  }

  /* 8 orelhas around the canvas */
  .canvas-orelha {
    position: absolute; width: 60px; height: 60px; z-index: 20;
    animation: canvasOrelhaSpin 2s linear infinite;
    filter: drop-shadow(0 0 8px #ff6ec7);
  }
  .canvas-orelha.co-top    { top: -30px; left: 50%; transform: translateX(-50%); }
  .canvas-orelha.co-bottom { bottom: -30px; left: 50%; transform: translateX(-50%) rotate(180deg); }
  .canvas-orelha.co-left   { left: -30px; top: 50%; transform: translateY(-50%) rotate(-90deg); }
  .canvas-orelha.co-right  { right: -30px; top: 50%; transform: translateY(-50%) rotate(90deg); }
  .canvas-orelha.co-tl     { top: -25px; left: -25px; }
  .canvas-orelha.co-tr     { top: -25px; right: -25px; }
  .canvas-orelha.co-bl     { bottom: -25px; left: -25px; }
  .canvas-orelha.co-br     { bottom: -25px; right: -25px; }
  @keyframes canvasOrelhaSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  canvas {
    display: block;
    border-radius: 16px;
    background: rgba(10,0,20,0.9);
  }

  /* ========== CENTRAL ORELLHA OVER CANVAS ========== */
  .central-orelha {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 100px; height: 100px;
    z-index: 15;
    pointer-events: none;
    animation: centralPulse 1s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 20px #ff6ec7) drop-shadow(0 0 40px #ff00ff) drop-shadow(0 0 60px #00ffff);
  }
  @keyframes centralPulse {
    0% { transform: translate(-50%,-50%) scale(0.8); opacity: 0.7; }
    100% { transform: translate(-50%,-50%) scale(1.2); opacity: 1; }
  }

  /* ========== CONTROLS ========== */
  .controls {
    margin: 30px auto;
    text-align: center;
    position: relative; z-index: 10;
  }
  .controls label.file-label {
    display: inline-block;
    padding: 15px 30px;
    background: linear-gradient(135deg, #ff6ec7, #ff00ff, #00ffff);
    border: 3px solid #ff6ec7;
    border-radius: 12px;
    font-family: 'Press Start 2P', monospace;
    font-size: 0.6rem;
    color: #0a0014;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 2px;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .controls label.file-label::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    animation: shimmer 2s infinite;
  }
  @keyframes shimmer {
    100% { left: 100%; }
  }
  .controls label.file-label:hover {
    transform: scale(1.05);
    box-shadow: 0 0 30px #ff6ec7, 0 0 60px #ff00ff;
  }
  .controls label.file-label:active { transform: scale(0.95); }
  #audioFile { display: none; }

  .track-name {
    margin-top: 15px;
    font-size: 0.55rem;
    color: #00ffff;
    text-shadow: 0 0 5px #00ffff;
  }

  /* ========== VOLUME SLIDER ========== */
  .volume-container {
    margin-top: 20px;
    display: flex; align-items: center;
    justify-content: center; gap: 15px;
    position: relative; z-index: 10;
  }
  .volume-container img {
    width: 35px; height: 35px;
    animation: volOrelha 0.8s ease-in-out infinite alternate;
  }
  @keyframes volOrelha {
    0% { transform: rotate(-30deg); }
    100% { transform: rotate(30deg); }
  }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 200px; height: 12px;
    background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00);
    border-radius: 6px; outline: none;
    border: 2px solid #ff6ec7;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 30px; height: 30px;
    background: url('orelha_nobg.png') center/contain no-repeat;
    cursor: pointer;
  }

  /* ========== EQUALIZER BARS DECORATION ========== */
  .eq-deco {
    position: fixed; bottom: 60px;
    display: flex; gap: 4px; z-index: 5;
    opacity: 0.3;
  }
  .eq-deco.left { left: 60px; }
  .eq-deco.right { right: 60px; }
  .eq-bar {
    width: 8px; background: #ff6ec7;
    border-radius: 4px 4px 0 0;
    animation: eqBounce 0.6s ease-in-out infinite alternate;
    transform-origin: bottom;
  }
  .eq-bar:nth-child(1) { height: 20px; animation-delay: 0s; }
  .eq-bar:nth-child(2) { height: 35px; animation-delay: 0.1s; background: #ff00ff; }
  .eq-bar:nth-child(3) { height: 25px; animation-delay: 0.2s; background: #00ffff; }
  .eq-bar:nth-child(4) { height: 45px; animation-delay: 0.3s; background: #ffff00; }
  .eq-bar:nth-child(5) { height: 30px; animation-delay: 0.4s; background: #ff6ec7; }
  .eq-bar:nth-child(6) { height: 40px; animation-delay: 0.15s; background: #ff00ff; }
  .eq-bar:nth-child(7) { height: 20px; animation-delay: 0.25s; background: #00ffff; }
  @keyframes eqBounce {
    0% { transform: scaleY(0.3); }
    100% { transform: scaleY(1.5); }
  }

  /* ========== SCROLLING ORELLHA STRIP ========== */
  .orelha-strip {
    position: fixed; z-index: 3; opacity: 0.15;
    display: flex; white-space: nowrap;
    animation: scrollStrip 20s linear infinite;
  }
  .orelha-strip.top-strip { top: 140px; }
  .orelha-strip.mid-strip { top: 50%; transform: translateY(-50%) rotate(-5deg); }
  .orelha-strip.bot-strip { bottom: 140px; }
  .orelha-strip img {
    width: 40px; height: 40px; margin: 0 10px;
    flex-shrink: 0;
  }
  @keyframes scrollStrip {
    from { transform: translateX(100vw); }
    to { transform: translateX(-200%); }
  }

  /* ========== DECORATION CORNERS WITH ORELLHA NOBG ========== */
  .deco-nobg {
    position: fixed; z-index: 2;
    width: 150px; height: 150px;
    opacity: 0.15;
    pointer-events: none;
  }
  .deco-nobg.d-tl { top: 60px; left: 60px; transform: rotate(-30deg); }
  .deco-nobg.d-tr { top: 60px; right: 60px; transform: rotate(30deg) scaleX(-1); }
  .deco-nobg.d-bl { bottom: 60px; left: 60px; transform: rotate(30deg); }
  .deco-nobg.d-br { bottom: 60px; right: 60px; transform: rotate(-30deg) scaleX(-1); }

  /* ========== RAINING ORELLHAS ========== */
  .rain-container {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 1;
    overflow: hidden;
  }
  .rain-orelha {
    position: absolute;
    width: 30px; height: 30px;
    animation: rain linear infinite;
    opacity: 0.25;
  }
  @keyframes rain {
    0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
    10% { opacity: 0.25; }
    90% { opacity: 0.25; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* ========== VU METERS ========== */
  .vu-container {
    display: flex; gap: 40px; justify-content: center;
    margin: 20px auto; position: relative; z-index: 10;
  }
  .vu-meter {
    width: 120px; height: 70px;
    border: 3px solid #ff6ec7;
    border-radius: 10px;
    background: rgba(10,0,20,0.9);
    position: relative; overflow: hidden;
    box-shadow: 0 0 15px rgba(255,110,199,0.3);
  }
  .vu-meter .vu-bar {
    position: absolute; bottom: 0; left: 0;
    width: 100%;
    background: linear-gradient(0deg, #00ff00, #ffff00, #ff0000);
    transition: height 0.1s;
  }
  .vu-meter .vu-label {
    position: absolute; bottom: 3px; left: 50%;
    transform: translateX(-50%);
    font-size: 0.35rem; color: white;
    text-shadow: 0 0 3px white;
    z-index: 2;
  }
  .vu-orelha {
    position: absolute; top: -15px; left: 50%;
    transform: translateX(-50%);
    width: 30px; height: 30px; z-index: 3;
    animation: vuOrelhaWiggle 0.5s ease-in-out infinite alternate;
  }
  @keyframes vuOrelhaWiggle {
    0% { transform: translateX(-50%) rotate(-20deg); }
    100% { transform: translateX(-50%) rotate(20deg); }
  }

  /* ========== ORELLHA RING ========== */
  .orelha-ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 500px; height: 500px;
    pointer-events: none; z-index: 0;
    animation: ringRotate 20s linear infinite;
  }
  .orelha-ring img {
    position: absolute;
    width: 40px; height: 40px;
    filter: drop-shadow(0 0 5px #ff6ec7);
  }
  @keyframes ringRotate {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }

  /* ========== SPARKLE ORELLHAS ========== */
  .sparkle {
    position: fixed; pointer-events: none; z-index: 200;
    width: 20px; height: 20px;
    animation: sparkle 2s ease-in-out infinite;
  }
  @keyframes sparkle {
    0%, 100% { transform: scale(0) rotate(0deg); opacity: 0; }
    50% { transform: scale(1.5) rotate(180deg); opacity: 1; }
  }

  /* ========== BOTTOM INFO ========== */
  .bottom-info {
    text-align: center; margin: 40px 0 80px;
    position: relative; z-index: 10;
    font-size: 0.45rem; color: #ff6ec7;
    line-height: 2;
  }
  .bottom-info .orelha-inline {
    width: 16px; height: 16px;
    vertical-align: middle;
    animation: inlineWiggle 0.5s ease-in-out infinite alternate;
    display: inline-block;
  }
  @keyframes inlineWiggle {
    0% { transform: rotate(-10deg); }
    100% { transform: rotate(10deg); }
  }

  /* ========== SCROLLBAR ========== */
  ::-webkit-scrollbar { width: 16px; }
  ::-webkit-scrollbar-track {
    background: #0a0014;
    background-image: url('orelha.png');
    background-size: 16px 16px;
  }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(#ff6ec7, #ff00ff);
    border-radius: 8px;
    border: 2px solid #0a0014;
  }

  /* ========== STATUS ========== */
  .status {
    font-size: 0.5rem; color: #ffff00;
    text-align: center; margin-top: 10px;
    text-shadow: 0 0 5px #ffff00;
    animation: statusBlink 1s step-end infinite;
    position: relative; z-index: 10;
  }
  @keyframes statusBlink {
    0%, 70% { opacity: 1; }
    71%, 100% { opacity: 0; }
  }

  /* ========== DOUBLE RAINBOW LINE ========== */
  .rainbow-line {
    height: 4px; margin: 15px 60px;
    background: linear-gradient(90deg, #ff0000, #ff7700, #ffff00, #00ff00, #0000ff, #8b00ff, #ff0000);
    background-size: 200% 100%;
    animation: rainbowScroll 3s linear infinite;
    border-radius: 2px;
    box-shadow: 0 0 10px rgba(255,255,255,0.3);
    position: relative; z-index: 10;
  }
  @keyframes rainbowScroll {
    from { background-position: 0 0; }
    to { background-position: 200% 0; }
  }

  /* ========== GLOW ORBS ========== */
  .glow-orb {
    position: fixed; border-radius: 50%;
    pointer-events: none; z-index: 0;
    filter: blur(80px);
  }
  .glow-orb.g1 { width: 300px; height: 300px; top: 10%; left: 5%; background: #ff00ff44; animation: orbFloat 10s ease-in-out infinite; }
  .glow-orb.g2 { width: 250px; height: 250px; top: 60%; right: 5%; background: #00ffff44; animation: orbFloat 12s ease-in-out infinite reverse; }
  .glow-orb.g3 { width: 200px; height: 200px; bottom: 10%; left: 40%; background: #ff6ec744; animation: orbFloat 8s ease-in-out infinite; }
  @keyframes orbFloat {
    0%, 100% { transform: translate(0,0); }
    50% { transform: translate(40px, -30px); }
  }

  /* ========== HEARTBEAT TEXT ========== */
  .heartbeat {
    animation: heartbeat 1s ease-in-out infinite;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    14% { transform: scale(1.1); }
    28% { transform: scale(1); }
    42% { transform: scale(1.08); }
    56% { transform: scale(1); }
  }

  /* ========== DECORATIVE ORELLHAS INLINE ========== */
  .deco-row {
    display: flex; justify-content: center; gap: 8px;
    margin: 15px 0; position: relative; z-index: 10;
  }
  .deco-row img {
    width: 30px; height: 30px;
    filter: drop-shadow(0 0 5px #ff6ec7);
  }
  .deco-row img:nth-child(odd) {
    animation: decoRowUp 0.8s ease-in-out infinite alternate;
  }
  .deco-row img:nth-child(even) {
    animation: decoRowDown 0.8s ease-in-out infinite alternate;
  }
  @keyframes decoRowUp { 0% { transform: translateY(0); } 100% { transform: translateY(-10px); } }
  @keyframes decoRowDown { 0% { transform: translateY(0); } 100% { transform: translateY(10px); } }

  /* ========== RADIAL ORELLHA BURST ========== */
  .radial-burst {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 0; height: 0;
    pointer-events: none; z-index: 0;
  }
  .burst-orelha {
    position: absolute; width: 25px; height: 25px;
    opacity: 0.08;
    transform-origin: center center;
  }

  /* ========== PLAYING STATE GLOW ========== */
  body.playing {
    animation: bgColorShift 4s ease-in-out infinite;
  }
  @keyframes bgColorShift {
    0% { background: #0a0014; }
    25% { background: #140028; }
    50% { background: #001428; }
    75% { background: #280014; }
    100% { background: #0a0014; }
  }

  /* ========== NOBG OVERLAY DECORATIONS ========== */
  .nobg-overlay {
    position: fixed; pointer-events: none; z-index: 2;
  }
  .nobg-overlay.n1 { top: 15%; left: 8%; width: 80px; height: 80px; transform: rotate(25deg); animation: nobgFloat 6s ease-in-out infinite; opacity: 0.12; }
  .nobg-overlay.n2 { top: 70%; right: 10%; width: 90px; height: 90px; transform: rotate(-15deg); animation: nobgFloat 7s ease-in-out infinite reverse; opacity: 0.1; }
  .nobg-overlay.n3 { top: 30%; right: 5%; width: 60px; height: 60px; transform: rotate(45deg); animation: nobgFloat 5s ease-in-out infinite; opacity: 0.08; }
  .nobg-overlay.n4 { bottom: 20%; left: 5%; width: 70px; height: 70px; transform: rotate(-45deg); animation: nobgFloat 8s ease-in-out infinite reverse; opacity: 0.1; }
  @keyframes nobgFloat {
    0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); }
    50% { transform: translateY(-20px) rotate(calc(var(--r, 0deg) + 20deg)); }
  }
</style>
</head>
<body>

<!-- BACKGROUND ORELLHA TILE -->
<div class="orelha-bg"></div>

<!-- GLOW ORBS -->
<div class="glow-orb g1"></div>
<div class="glow-orb g2"></div>
<div class="glow-orb g3"></div>

<!-- RAINING ORELLHAS -->
<div class="rain-container" id="rainContainer"></div>

<!-- BORDER ORELLHAS -->
<div class="orelha-border-top" id="borderTop"></div>
<div class="orelha-border-bottom" id="borderBottom"></div>
<div class="orelha-border-left" id="borderLeft"></div>
<div class="orelha-border-right" id="borderRight"></div>

<!-- CORNER ORELLHAS -->
<img class="corner-orelha tl" src="orelha.png" alt="">
<img class="corner-orelha tr" src="orelha.png" alt="">
<img class="corner-orelha bl" src="orelha.png" alt="">
<img class="corner-orelha br" src="orelha.png" alt="">

<!-- FLOATING ORELLHAS -->

<script>
(function() {
  // ========== GENERATE DECORATIONS ==========
  const borderTop = document.getElementById('borderTop');
  const borderBottom = document.getElementById('borderBottom');
  const borderLeft = document.getElementById('borderLeft');
  const borderRight = document.getElementById('borderRight');
  const stripTop = document.getElementById('stripTop');
  const stripBot = document.getElementById('stripBot');
  const rainContainer = document.getElementById('rainContainer');
  const radialBurst = document.getElementById('radialBurst');

  // Border orelhas
  for (let i = 0; i < 40; i++) {
    const img = document.createElement('img');
    img.src = i % 3 === 0 ? 'orelha_nobg.png' : 'orelha.png';
    img.alt = '';
    img.style.animationDelay = (i * 0.05) + 's';
    borderTop.appendChild(img);
    const img2 = img.cloneNode();
    img2.style.animationDelay = (i * 0.05 + 0.1) + 's';
    borderBottom.appendChild(img2);
  }
  for (let i = 0; i < 30; i++) {
    const img = document.createElement('img');
    img.src = i % 2 === 0 ? 'orelha.png' : 'orelha_nobg.png';
    img.alt = '';
    img.style.animationDelay = (i * 0.07) + 's';
    borderLeft.appendChild(img);
    const img2 = img.cloneNode();
    img2.style.animationDelay = (i * 0.07 + 0.15) + 's';
    borderRight.appendChild(img2);
  }

  // Scrolling strips
  for (let i = 0; i < 60; i++) {
    const img = document.createElement('img');
    img.src = i % 4 === 0 ? 'orelha_nobg.png' : 'orelha.png';
    stripTop.appendChild(img);
    const img2 = img.cloneNode();
    stripBot.appendChild(img2);
  }

  // Rain
  for (let i = 0; i < 25; i++) {
    const img = document.createElement('img');
    img.src = i % 3 === 0 ? 'orelha_nobg.png' : 'orelha.png';
    img.className = 'rain-orelha';
    img.style.left = Math.random() * 100 + '%';
    img.style.animationDuration = (3 + Math.random() * 5) + 's';
    img.style.animationDelay = Math.random() * 8 + 's';
    img.style.opacity = 0.1 + Math.random() * 0.2;
    rainContainer.appendChild(img);
  }

  // Radial burst orelhas
  for (let i = 0; i < 24; i++) {
    const img = document.createElement('img');
    img.src = i % 2 === 0 ? 'orelha.png' : 'orelha_nobg.png';
    img.className = 'burst-orelha';
    const angle = (i / 24) * 360;
    const dist = 220;
    const x = Math.cos(angle * Math.PI / 180) * dist;
    const y = Math.sin(angle * Math.PI / 180) * dist;
    img.style.transform = `translate(${x}px, ${y}px) rotate(${angle}deg)`;
    radialBurst.appendChild(img);
  }

  // ========== AUDIO SETUP ==========
  const audioFile = document.getElementById('audioFile');
  const audioPlayer = document.getElementById('audioPlayer');
  const canvas = document.getElementById('visualizer');
  const ctx = canvas.getContext('2d');
  const trackName = document.getElementById('trackName');
  const statusText = document.getElementById('statusText');
  const volumeSlider = document.getElementById('volumeSlider');
  const vuLeft = document.getElementById('vuLeft');
  const vuRight = document.getElementById('vuRight');

  let audioCtx, analyser, source, dataArray, bufferLength;
  let isPlaying = false;

  audioFile.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    trackName.textContent = '> ' + file.name;
    statusText.textContent = '>>> LOADING <<<';
    document.body.classList.add('playing');

    if (audioCtx) {
      audioCtx.close();
    }

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.8;

    bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);

    source = audioCtx.createMediaElementSource(audioPlayer);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);

    const url = URL.createObjectURL(file);
    audioPlayer.src = url;
    audioPlayer.volume = volumeSlider.value;
    audioPlayer.play();
    isPlaying = true;
    statusText.textContent = '>>> NOW PLAYING <<<';
    draw();
  });

  volumeSlider.addEventListener('input', function() {
    audioPlayer.volume = this.value;
  });

  // ========== VISUALIZER DRAW ==========
  function draw() {
    requestAnimationFrame(draw);
    analyser.getByteFrequencyData(dataArray);

    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // Background gradient
    const bgGrad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);
    bgGrad.addColorStop(0, 'rgba(40, 0, 60, 0.3)');
    bgGrad.addColorStop(1, 'rgba(10, 0, 20, 0)');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, w, h);

    const barCount = 80;
    const barWidth = w / barCount;
    let sumL = 0, sumR = 0;

    for (let i = 0; i < barCount; i++) {
      const dataIndex = Math.floor(i * bufferLength / barCount);
      const val = dataArray[dataIndex] / 255;
      const barH = val * h * 0.85;

      if (i < barCount / 2) sumL += val;
      else sumR += val;

      const x = i * barWidth;
      const y = h - barH;

      // Bar gradient
      const grad = ctx.createLinearGradient(x, h, x, y);
      grad.addColorStop(0, '#ff6ec7');
      grad.addColorStop(0.5, '#ff00ff');
      grad.addColorStop(1, '#00ffff');
      ctx.fillStyle = grad;
      ctx.shadowColor = '#ff6ec7';
      ctx.shadowBlur = val * 20;

      ctx.beginPath();
      ctx.roundRect(x + 1, y, barWidth - 2, barH, [3, 3, 0, 0]);
      ctx.fill();

      // Orelha on top of tall bars
      if (val > 0.7) {
        ctx.save();
        ctx.shadowBlur = 0;
        const oSize = 16;
        const oImg = i % 2 === 0 ? orelhaImgA : orelhaImgB;
        ctx.drawImage(oImg, x + barWidth/2 - oSize/2, y - oSize/2, oSize, oSize);
        ctx.restore();
      }
    }

    // Center mirror line
    ctx.strokeStyle = '#ff6ec744';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(w/2, 0);
    ctx.lineTo(w/2, h);
    ctx.stroke();

    // VU meters
    const avgL = (sumL / (barCount / 2)) * 100;
    const avgR = (sumR / (barCount / 2)) * 100;
    vuLeft.style.height = Math.min(avgL * 1.5, 95) + '%';
    vuRight.style.height = Math.min(avgR * 1.5, 95) + '%';
  }

  // Preload orelha images for canvas drawing
  const orelhaImgA = new Image();
  const orelhaImgB = new Image();
  orelhaImgA.src = 'orelha.png';
  orelhaImgB.src = 'orelha_nobg.png';

  // Idle animation when no audio
  function idleDraw() {
    if (isPlaying) return;
    requestAnimationFrame(idleDraw);
    const w = canvas.width;
    const h = canvas.height;
    const t = Date.now() / 1000;
    ctx.clearRect(0, 0, w, h);

    const barCount = 80;
    const barWidth = w / barCount;

    for (let i = 0; i < barCount; i++) {
      const val = (Math.sin(t * 2 + i * 0.3) * 0.3 + 0.35);
      const barH = val * h * 0.5;
      const x = i * barWidth;
      const y = h - barH;

      const grad = ctx.createLinearGradient(x, h, x, y);
      grad.addColorStop(0, 'rgba(255,110,199,0.3)');
      grad.addColorStop(1, 'rgba(0,255,255,0.3)');
      ctx.fillStyle = grad;
      ctx.shadowColor = '#ff6ec744';
      ctx.shadowBlur = 5;

      ctx.beginPath();
      ctx.roundRect(x + 1, y, barWidth - 2, barH, [3, 3, 0, 0]);
      ctx.fill();
    }
  }
  idleDraw();
})();
</script>
